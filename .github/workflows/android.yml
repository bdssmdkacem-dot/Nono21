name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Create Android project files
        working-directory: android_app
        run: flutter create . --platforms=android --org com.bdssmdkacem
      - name: Enable local HTTP server access
        working-directory: android_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              '<application ',
              '<application android:usesCleartextTraffic="true" ',
              1,
          )
          p.write_text(s)
          PY
      - name: Get packages
        working-directory: android_app
        run: flutter pub get
      - name: Build APK
        working-directory: android_app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nono21-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
